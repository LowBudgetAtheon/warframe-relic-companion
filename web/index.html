<!DOCTYPE html>
<html lang="en">
<head>

<title>Warframe Relic Companion</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-theme="orokin-dark">

  <div>

      <circle class="glow" cx="54" cy="54" r="14"/><circle class="glow b" cx="54" cy="54" r="8.7"/>

      <path class="sp s" style="--d:0.40s" d="M65.31,42.69 L70.69,40.99 L72.38,35.62 L67.01,37.31 Z"/><path class="sp s" style="--d:0.46s" d="M65.31,65.31 L67.01,70.69 L72.38,72.38 L70.69,67.01 Z"/><path class="sp s" style="--d:0.52s" d="M42.69,65.31 L37.31,67.01 L35.62,72.38 L40.99,70.69 Z"/><path class="sp s" style="--d:0.58s" d="M42.69,42.69 L40.99,37.31 L35.62,35.62 L37.31,40.99 Z"/>

    <div class="ttl">Relic Companion<small>Warframe</small></div>
  </div>
</div>

<main class="pages" id="pages">
  <section class="page" id="pg-profile"><div class="wrap" id="profile"></div></section>
  <section class="page" id="pg-coll"><div class="wrap" id="main"></div></section>
  <section class="page" id="pg-home"><div class="wrap" id="home"></div></section>
  <section class="page" id="pg-relics"><div class="wrap" id="runs"></div></section>
  <section class="page" id="pg-vendors"><div class="wrap" id="rotating"></div></section>
</main>

<section class="subpage" id="sub" aria-hidden="true">
  <div class="subhead"><button class="iconbtn subback" id="subBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><h1 id="subTitle"></h1></div>
  <div class="subbody" id="subBody"><div class="wrap" id="subWrap"></div></div>
</section>

<nav class="bnav" id="bnav" aria-label="Pages">
  <button data-page="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Profile</span></button>
  <button data-page="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg><span>Collection</span></button>
  <button data-page="2" id="homeTab"><span class="ico-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="ico-focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span><span class="lbl-home">Home</span><span class="lbl-focus">Focus</span></button>
  <button data-page="3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 20 12 12 21 4 12z"/><path d="M12 8 16 12 12 16 8 12z"/></svg><span>Relics</span></button>
  <button data-page="4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>Vendors</span></button>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Menu"></aside>
<aside class="wpanel" id="weekly" aria-label="Checklist"></aside>
<div id="modalRoot"></div>

<script src="secrets.js"></script>
<script src="hidden.js"></script>
<script src="app.js"></script>
<script src="inventory.js"></script>
</body>
</html>
