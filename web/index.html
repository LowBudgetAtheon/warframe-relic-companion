<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Warframe Relic Companion</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-theme="orokin-dark">

<div id="intro" aria-hidden="true">
  <div>
    <svg viewBox="0 0 108 108">
      <circle class="glow" cx="54" cy="54" r="14"/><circle class="glow b" cx="54" cy="54" r="8.7"/>
      <path class="sp" style="--d:0.05s" d="M54.00,39.00 L57.60,30.00 L54.00,21.00 L50.40,30.00 Z"/><path class="sp" style="--d:0.13s" d="M69.00,54.00 L78.00,57.60 L87.00,54.00 L78.00,50.40 Z"/><path class="sp" style="--d:0.21s" d="M54.00,69.00 L50.40,78.00 L54.00,87.00 L57.60,78.00 Z"/><path class="sp" style="--d:0.29s" d="M39.00,54.00 L30.00,50.40 L21.00,54.00 L30.00,57.60 Z"/>
      <path class="sp s" style="--d:0.40s" d="M65.31,42.69 L70.69,40.99 L72.38,35.62 L67.01,37.31 Z"/><path class="sp s" style="--d:0.46s" d="M65.31,65.31 L67.01,70.69 L72.38,72.38 L70.69,67.01 Z"/><path class="sp s" style="--d:0.52s" d="M42.69,65.31 L37.31,67.01 L35.62,72.38 L40.99,70.69 Z"/><path class="sp s" style="--d:0.58s" d="M42.69,42.69 L40.99,37.31 L35.62,35.62 L37.31,40.99 Z"/>
      <circle class="ring" cx="54" cy="54" r="13.5"/>
      <circle class="dots" cx="54" cy="54" r="17"/>
      <path class="core" d="M54.00,45.00 L60.00,54.00 L54.00,63.00 L48.00,54.00 Z"/>
    </svg>
    <div class="ttl">Relic Companion<small>Warframe</small></div>
  </div>
</div>

<div class="topbar">
  <div class="in">
    <button class="menubtn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <nav class="tabs" id="tabs">
      <a data-page="0">Rotating</a>
      <a data-page="1">Relic Runs</a>
      <a data-page="2">Favorites</a>
      <a data-page="3">Main</a>
    </nav>
    <button class="menubtn" id="weeklyBtn" aria-label="Open checklist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.6 1.6L8.5 5M4 12.5l1.6 1.6L8.5 11M4 18.5l1.6 1.6L8.5 17M12 7h8M12 13h8M12 19h8"/></svg>
    </button>
  </div>
  <div class="updated" id="updated"></div>
</div>

<main class="pages" id="pages">
  <section class="page" id="pg-rotating"><div class="wrap" id="rotating"></div></section>
  <section class="page" id="pg-runs"><div class="wrap" id="runs"></div></section>
  <section class="page" id="pg-favs"><div class="wrap" id="favs"></div></section>
  <section class="page" id="pg-main"><div class="wrap" id="main"></div></section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Menu"></aside>
<aside class="wpanel" id="weekly" aria-label="Checklist"></aside>
<div id="modalRoot"></div>

<script src="secrets.js"></script>
<script src="hidden.js"></script>
<script src="app.js"></script>
</body>
</html>
