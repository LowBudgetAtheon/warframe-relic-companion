<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unmastered Prime Weapons – Parts Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14; --panel:#121921; --panel2:#17212b; --line:#24313d;
    --text:#e6edf3; --muted:#8b9aa8; --gold:#d9b44a; --gold2:#f1d27a;
    --teal:#4fd1c5; --done:#3b4a57;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1a2633 0%,var(--bg) 60%);color:var(--text);
    font:15px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 60px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tabs a{font:700 15px Rajdhani,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;
    padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs a.on{color:var(--gold2);border-color:var(--gold)}
  header h1{font:700 28px/1.1 Rajdhani,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;color:var(--gold2)}
  header p{margin:0;color:var(--muted);font-size:13.5px}
  .summary{margin:16px 0 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:Rajdhani,sans-serif}
  .sumrow b{font-size:22px;color:var(--teal)}
  .sumsub{font-size:12.5px;color:var(--muted);margin-top:4px}
  .bar{height:6px;background:#1e2a35;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0;transition:width .25s}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:99px;padding:6px 12px;
    font:600 13px Rajdhani,sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
  .chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2);background:#221d10}
  .chip.ghost{background:transparent}
  .toast{color:var(--teal);font-size:12.5px;align-self:center;min-height:1em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card.complete{border-color:#2f5f5a}
  .card.complete .name{color:var(--teal)}
  .card.built{opacity:.55}
  .chead{padding:12px 14px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#18222d,#121921)}
  .name{font:700 19px/1.1 Rajdhani,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--gold2)}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
  .tag{font:600 11px Rajdhani,sans-serif;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .cbar{height:3px;background:#1e2a35;margin-top:8px;border-radius:99px;overflow:hidden}
  .cbar i{display:block;height:100%;background:var(--teal);width:0;transition:width .2s}
  ul{list-style:none;margin:0;padding:6px 6px 8px}
  li label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none}
  li label:hover{background:var(--panel2)}
  li input{appearance:none;width:20px;height:20px;flex:none;border:1.5px solid #4a5b6a;border-radius:5px;display:grid;place-items:center;margin:0;cursor:pointer}
  li input:checked{background:var(--teal);border-color:var(--teal)}
  li input:checked::after{content:"";width:5px;height:10px;border:solid #0b0f14;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  li input:checked + span{color:var(--done);text-decoration:line-through}
  .sub{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .group{font:600 11.5px Rajdhani,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
  .note{margin:0 12px 12px;padding:8px 10px;font-size:12.5px;color:#c9d4de;background:#1a1610;border-left:3px solid var(--gold);border-radius:6px}
  .builtbtn{margin:0 12px 12px;align-self:flex-start;background:none;border:1px dashed #3a4a58;color:var(--muted);border-radius:6px;
    padding:4px 10px;font:600 12px Rajdhani,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .card.built .builtbtn{border-style:solid;color:var(--teal);border-color:var(--teal)}
  .hidden{display:none}
  .sec{font:700 18px Rajdhani,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);margin:22px 0 4px}
  .secsub{color:var(--muted);font-size:13px;margin:0 0 12px}
  .hv .card{border-color:#5a4a1e;background:linear-gradient(180deg,#1a1710,#121921)}
  .rlist{padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
  .rrow{display:flex;align-items:center;gap:8px;font-size:13.5px}
  .rrow .pn{flex:1}
  .rar{font:600 11px Rajdhani,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;white-space:nowrap}
  .rar.C{background:#3a2a1a;color:#e0a96d}.rar.U{background:#2b3038;color:#d4dbe3}.rar.R{background:#3b3214;color:#f1d27a}
  .st{font-size:11.5px}.st.av{color:var(--teal)}.st.ba{color:#c9a0ff}.st.va{color:var(--muted)}
  .part{padding:8px 12px;border-top:1px solid var(--line)}
  .part:first-of-type{border-top:none}
  .part b{font-weight:600;font-size:13.5px}
  .part .need{color:var(--muted);font-size:12px;margin-left:6px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .rchip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--panel2);white-space:nowrap}
  .rchip i{font-style:normal;font-weight:600;margin-left:4px}
  .rchip.C i{color:#e0a96d}.rchip.U i{color:#d4dbe3}.rchip.R i{color:#f1d27a}
  .rchip.hot{border-color:var(--gold)}
  .rchip.av{border-color:var(--teal)}
  .empty{color:var(--muted);padding:20px 0}
  footer{margin-top:22px;color:var(--muted);font-size:12px}
  footer a{color:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs">
    <a href="#weapons" data-view="weapons">Weapons</a>
    <a href="#relics" data-view="relics">Relics</a>

  </nav>

    <h1 id="title"></h1>

/* ---------- STATE ---------- */
const KEY="wf-prime-checklist-v2";
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const groupsOf=w=>w.groups||[{g:null,parts:w.parts}];
function itemsOf(w){
  const out=[];
  groupsOf(w).forEach(gr=>gr.parts.forEach(([p,c,h])=>{
    for(let i=1;i<=c;i++) out.push({id:slug(w.n+"|"+(gr.g||"")+"|"+p+"|"+i),part:p,i,c,group:gr.g,seed:i<=(h||0)});
  }));
  return out;
}
function seedState(){
  const s={ticks:{},built:{}};
  [...WEAPONS,...FRAMES].forEach(w=>itemsOf(w).forEach(it=>{ if(it.seed) s.ticks[it.id]=1; }));
  return s;
}
let state;
try{ state=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ state=null; }
if(!state||!state.ticks) state=seedState();
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} };

/* ---------- RENDER ---------- */
const grid=document.getElementById("grid");
let view="weapons", filter="all", hideDone=false;
const fullName=(w,it)=>it.part.includes("Prime")?it.part:`${w.n} ${it.part}`;
const shortName=(w,it)=>w.frame?it.part.replace(" Blueprint","").replace(/^Blueprint$/,"Main Blueprint"):fullName(w,it);

function neededParts(){
  const m={};
  WEAPONS.forEach(w=>itemsOf(w).forEach(it=>{
    if(!state.ticks[it.id]){ const k=fullName(w,it); (m[k]=m[k]||{w:w.n,n:0}).n++; }
  }));
  return m;
}
function relicMap(){
  const need=neededParts(), rm={};
  Object.entries(need).forEach(([k,v])=>relicsFor(k).forEach(({relic,rar})=>{
    (rm[relic]=rm[relic]||[]).push({key:k,rar,w:v.w,n:v.n});
  }));
  return {need,rm};
}
const tierOf=r=>r.split(" ")[0];
const stCls=r=>AVAILABLE.has(r)?"av":BARO.has(r)?"ba":"va";

function renderRelics(){
  const {need,rm}=relicMap();
  const tierOk=r=>filter==="all"||tierOf(r)===filter;
  const hv=Object.entries(rm).filter(([r,l])=>l.length>1&&tierOk(r))
    .sort((a,b)=>b[1].length-a[1].length || (AVAILABLE.has(b[0])-AVAILABLE.has(a[0])) || a[0].localeCompare(b[0],undefined,{numeric:true}));
  const hvSet=new Set(Object.entries(rm).filter(([,l])=>l.length>1).map(([r])=>r));
  let html=`<h2 class="sec">High value</h2><p class="secsub">Relics that each hold two or more different parts you still need.</p>`;
  html+=hv.length?`<div class="grid hv">`+hv.map(([r,l])=>`<article class="card"><div class="chead"><div class="name">${r}</div>
      <div class="meta"><span class="tag">${l.length} parts you need</span><span class="st ${stCls(r)}">${statusOf(r)}</span></div></div>
      <div class="rlist">${l.sort((a,b)=>RAR_ORDER[a.rar]-RAR_ORDER[b.rar]).map(p=>`<div class="rrow"><span class="pn">${p.key}</span><span class="rar ${p.rar}">${RAR[p.rar]}</span></div>`).join("")}</div></article>`).join("")+`</div>`
    : `<p class="empty">No relics in this tier hold more than one part you need.</p>`;
  html+=`<h2 class="sec">By weapon</h2><p class="secsub">Every relic for each missing part. Gold outline = also in High value. Teal outline = drops right now.</p><div class="grid">`;
  WEAPONS.forEach(w=>{
    const keys=[...new Set(itemsOf(w).map(it=>fullName(w,it)))].filter(k=>need[k]);
    if(!keys.length) return;
    html+=`<article class="card"><div class="chead"><div class="name">${w.n}</div><div class="meta"><span class="tag">${w.t}</span><span>${keys.length} part${keys.length>1?"s":""} missing</span></div></div>`;
    keys.forEach(k=>{
      const rs=relicsFor(k).filter(x=>tierOk(x.relic)).sort((a,b)=>RAR_ORDER[b.rar]-RAR_ORDER[a.rar]||a.relic.localeCompare(b.relic,undefined,{numeric:true}));
      html+=`<div class="part"><b>${k}</b>${need[k].n>1?`<span class="need">need ${need[k].n}</span>`:""}<div class="chips">`+
        (rs.length?rs.map(x=>`<span class="rchip ${x.rar}${hvSet.has(x.relic)?" hot":""}${AVAILABLE.has(x.relic)?" av":""}">${x.relic}<i>${x.rar}</i></span>`).join(""):`<span class="secsub">None in this tier</span>`)+`</div></div>`;
    });
    html+=`</article>`;
  });
  html+=`</div>`;
  grid.className=""; grid.innerHTML=html;
  const total=Object.keys(rm).length;
  document.getElementById("sumLabel").textContent="High-value relics";
  document.getElementById("sumText").textContent=hvSet.size;
  document.getElementById("sumSub").textContent=`${total} relics drop at least one part you need · ${Object.keys(need).length} different parts missing`;
}

function render(){
  const V=VIEWS[view];
  document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.dataset.view===view));
  document.getElementById("title").textContent=V.title;
  document.getElementById("intro").textContent=V.intro;
  document.getElementById("foot").innerHTML=V.foot;
  document.getElementById("filters").innerHTML=V.filters.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${k===filter}">${l}</button>`).join("");
  const isR=view==="relics";
  document.querySelector(".bar").classList.toggle("hidden",isR);
  document.getElementById("hideDone").classList.toggle("hidden",isR);
  document.getElementById("resetBtn").classList.toggle("hidden",isR);
  document.getElementById("copyBtn").textContent=isR?"Copy high-value list":"Copy still-needed list";
  if(isR){ renderRelics(); return; }
  grid.className="grid";
  grid.innerHTML="";
  V.data.forEach(w=>{
    const card=document.createElement("article");
    card.className="card"; card.dataset.w=slug(w.n);
    let html=`<div class="chead"><div class="name">${w.n}</div>
      <div class="meta"><span class="tag">${w.t}</span><span class="cnt"></span></div>
      <div class="cbar"><i></i></div></div><ul>`;
    let last;
    itemsOf(w).forEach(it=>{
      if(it.group&&it.group!==last){ html+=`<li class="group">${it.group}</li>`; last=it.group; }
      const sub=it.c>1?`<span class="sub">${it.i} of ${it.c}</span>`:"";
      html+=`<li><label><input type="checkbox" data-id="${it.id}" ${state.ticks[it.id]?"checked":""}><span>${shortName(w,it)}</span>${sub}</label></li>`;
    });
    html+=`</ul>`;
    if(w.note) html+=`<div class="note">${w.note}</div>`;
    if(w.frame) html+=`<button class="builtbtn" data-built="${slug(w.n)}">Already own it</button>`;
    card.innerHTML=html; grid.appendChild(card);
  });
  update();
}

function update(){
  const V=VIEWS[view]; let tot=0,got=0,ready=0,built=0;
  V.data.forEach(w=>{
    const items=itemsOf(w),n=items.length,g=items.filter(i=>state.ticks[i.id]).length;
    const isBuilt=!!state.built[slug(w.n)];
    tot+=n; got+=g; if(isBuilt) built++; else if(g===n) ready++;
    const card=grid.querySelector(`[data-w="${slug(w.n)}"]`);
    card.classList.toggle("built",isBuilt);
    card.classList.toggle("complete",g===n&&!isBuilt);
    card.querySelector(".cnt").textContent=isBuilt?"Owned ✓":(g===n?"Ready to build ✓":`${g} / ${n} parts`);
    card.querySelector(".cbar i").style.width=(isBuilt?100:100*g/n)+"%";
    let show=true;
    if(view==="frames"){
      if(filter==="ready") show=g===n&&!isBuilt;
      else if(filter==="started") show=g>0&&g<n&&!isBuilt;
      else if(filter==="none") show=g===0&&!isBuilt;
    } else if(filter!=="all") show=w.t===filter;
    if(hideDone&&(g===n||isBuilt)) show=false;
    card.classList.toggle("hidden",!show);
  });
  document.getElementById("sumLabel").textContent=view==="frames"?"Frame parts collected":"Parts collected";
  document.getElementById("sumText").textContent=`${got} / ${tot}`;
  document.getElementById("sumBar").style.width=(tot?100*got/tot:0)+"%";
  document.getElementById("sumSub").textContent=view==="frames"
    ? `${ready} set${ready===1?"":"s"} ready to build${built?` · ${built} marked as owned`:""}`
    : `${ready} weapon${ready===1?"":"s"} ready to build`;
}

/* ---------- EVENTS ---------- */
grid.addEventListener("change",e=>{
  const id=e.target.dataset.id; if(!id) return;
  if(e.target.checked) state.ticks[id]=1; else delete state.ticks[id];
  save(); update();
});
grid.addEventListener("click",e=>{
  const b=e.target.closest("[data-built]"); if(!b) return;
  const k=b.dataset.built; if(state.built[k]) delete state.built[k]; else state.built[k]=1;
  save(); update();
});
document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest("[data-f]"); if(!b) return;
  filter=b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  if(view==="relics") renderRelics(); else update();
});
document.getElementById("hideDone").addEventListener("click",e=>{
  hideDone=!hideDone; e.currentTarget.setAttribute("aria-pressed",hideDone); update();
});
const toast=document.getElementById("toast");
function say(m){ toast.textContent=m; clearTimeout(say.t); say.t=setTimeout(()=>toast.textContent="",2500); }
document.getElementById("copyBtn").addEventListener("click",async()=>{
  if(view==="relics"){
    const {rm}=relicMap();
    const hv=Object.entries(rm).filter(([,l])=>l.length>1).sort((a,b)=>b[1].length-a[1].length);
    const txt=hv.length?hv.map(([r,l])=>`${r} (${statusOf(r)}): ${l.map(p=>p.key).join(", ")}`).join("\n"):"No high-value relics left.";
    try{ await navigator.clipboard.writeText(txt); say(`Copied ${hv.length} relics`); }catch(e){ say("Copy was blocked here"); }
    return;
  }
  const lines=[];
  VIEWS[view].data.forEach(w=>{
    if(state.built[slug(w.n)]) return;
    const need={};
    itemsOf(w).forEach(it=>{ if(!state.ticks[it.id]){ const k=fullName(w,it); need[k]=(need[k]||0)+1; } });
    Object.entries(need).forEach(([k,v])=>lines.push(v>1?`${k} x${v}`:k));
  });
  const txt=lines.length?lines.join("\n"):"Nothing left — everything's collected!";
  try{ await navigator.clipboard.writeText(txt); say(`Copied ${lines.length} line${lines.length===1?"":"s"}`); }
  catch(e){ say("Copy was blocked here"); }
});
let armed=false;
document.getElementById("resetBtn").addEventListener("click",e=>{
  const btn=e.currentTarget;
  if(!armed){ armed=true; btn.textContent="Tap again to reset"; setTimeout(()=>{armed=false;btn.textContent="Reset to inventory";},3000); return; }
  state=seedState(); save(); armed=false; btn.textContent="Reset to inventory"; render(); say("Back to what the video showed");
});

function route(){
  const h=location.hash.replace("#","");
  const v=VIEWS[h]?h:"weapons";
  if(v!==view){ view=v; filter="all"; }
  render();
}
window.addEventListener("hashchange",route);
view=VIEWS[location.hash.replace("#","")]?location.hash.replace("#",""):"weapons";
render();
</script>
</body>
</html>
