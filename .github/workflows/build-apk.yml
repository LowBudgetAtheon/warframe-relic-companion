name: Build APK

# Builds a signed APK and publishes it as a GitHub Release whenever the app
# changes on main. Data-only changes don't need a new APK: the app downloads
# data/relics.json on launch.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing key secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::error title=Signing key missing::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets first (docs/SETUP.md). Building without them would make an APK that can't update over later versions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Refresh relic data for the bundled copy (best effort)
        continue-on-error: true
        run: node scripts/build-data.mjs --merge-only-on-failure

      - name: Copy the web app, data and fonts into the APK
        run: |
          W="$GITHUB_WORKSPACE/android/app/src/main/assets/www"
          rm -rf "$W" && mkdir -p "$W/fonts" "$W/data"
          cp web/*.html web/*.css web/*.js "$W/"
          cp data/relics.json "$W/data/"
          cd "$RUNNER_TEMP"
          npm pack @fontsource/rajdhani@5 @fontsource/inter@5 --silent
          mkdir rj in
          tar xzf fontsource-rajdhani-*.tgz -C rj
          tar xzf fontsource-inter-*.tgz -C in
          for w in 500 600 700; do cp "rj/package/files/rajdhani-latin-$w-normal.woff2" "$W/fonts/"; done
          for w in 400 500 600; do cp "in/package/files/inter-latin-$w-normal.woff2" "$W/fonts/"; done
          # Duviri theme's storybook lettering
          npm pack @fontsource/im-fell-english-sc@5 @fontsource/crimson-pro@5 --silent
          mkdir fe cp
          tar xzf fontsource-im-fell-english-sc-*.tgz -C fe
          tar xzf fontsource-crimson-pro-*.tgz -C cp
          cp fe/package/files/im-fell-english-sc-latin-400-normal.woff2 "$W/fonts/"
          for w in 400 600; do cp "cp/package/files/crimson-pro-latin-$w-normal.woff2" "$W/fonts/"; done
          # Technocyte Coda theme's pixel lettering
          npm pack @fontsource/vt323@5 --silent
          mkdir vt && tar xzf fontsource-vt323-*.tgz -C vt
          cp vt/package/files/vt323-latin-400-normal.woff2 "$W/fonts/"
          ls -la "$W" "$W/fonts"

      - name: Decode the signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'wrc' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          F="WarframeRelicCompanion-$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$F"
          cat > notes.md <<NOTES
          **To install:** open this page on your Android phone, tap **$F** below to download it, then open the download. The first time, Android asks you to allow installs from your browser or Files app.

          Already have it? Installing this one updates it in place and keeps your progress.

          Built from commit ${GITHUB_SHA::7}.
          NOTES
          gh release create "v$V" "$F" --title "Warframe Relic Companion $V" --notes-file notes.md --latest

      - uses: actions/upload-artifact@v4
        with:
          name: WarframeRelicCompanion-apk
          path: WarframeRelicCompanion-*.apk
